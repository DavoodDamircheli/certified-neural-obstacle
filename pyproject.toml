[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certified_obstacle_nn"
version = "1.0.0"
description = "Certified neural approximations for parabolic obstacle problems"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "Davood Damircheli" }]
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "psutil",
    "python-flint==0.9.0",
    "mpmath>=1.3.0",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["certified_obstacle_nn*"]

[tool.pytest.ini_options]
testpaths = ["certified_obstacle_nn/tests", "certified_obstacle_nn/certification/tests"]
addopts = "-m \"not legacy\""
markers = [
    "legacy: global-Lipschitz certificate, American put, stress, adaptive and ablation tests (excluded by default; run all with pytest -m \"\")",
]
